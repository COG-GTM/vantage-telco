[project]
name = "vantage-net"
version = "2.4.0"
description = "Vantage inventory, management addressing and billing services"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pymongo>=4.6",
    "pydantic>=2.6",
    "telco-billing-rules @ git+https://github.com/COG-GTM/meridian-telco.git@3d5729a518b59b4e44bef8ca8f4c1b4c709854b2#subdirectory=billing-rules",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
