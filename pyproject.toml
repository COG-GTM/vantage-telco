[project]
name = "vantage-net"
version = "2.4.0"
description = "Vantage inventory, management addressing and billing services"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pymongo==4.17.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0",
    "mongomock==4.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]
"app/routers/capacity.py" = ["E501"]
"app/routers/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
files = ["app", "tools"]

[tool.coverage.run]
source = ["app"]
