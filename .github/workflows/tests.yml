name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure access to telco-capacity-rules
        env:
          RULES_TOKEN: ${{ secrets.TELCO_CAPACITY_RULES_TOKEN }}
        run: |
          [ -n "$RULES_TOKEN" ] || exit 0
          git config --global url."https://x-access-token:${RULES_TOKEN}@github.com/COG-GTM/telco-capacity-rules".insteadOf "https://github.com/COG-GTM/telco-capacity-rules"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
