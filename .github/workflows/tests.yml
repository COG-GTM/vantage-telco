name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # read-only token for the internal telco-capacity-rules repo
      - name: Configure access to shared billing rules
        env:
          TOKEN: ${{ secrets.TELCO_RULES_READ_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - run: pip install -r requirements.txt
      - run: pytest -q
